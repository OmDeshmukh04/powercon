name: Frontend CI & Deploy

on:
  pull_request:
    branches: [develop, main]

  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:

  # ─────────────────────────────────────────────
  # CI JOB
  # ─────────────────────────────────────────────
  ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.STAGING_API_URL }}
        run: npm run build


  # ─────────────────────────────────────────────
  # DEPLOY JOB (STAGING + PROD)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to S3
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [ci]
    runs-on: ubuntu-latest

    # GitHub Environments (important for secrets separation)
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        env:
          VITE_API_URL: ${{ github.ref == 'refs/heads/main' && secrets.PROD_API_URL || secrets.STAGING_API_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy to S3 (STRICT ENV CONTROL)
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            BUCKET="${{ secrets.PROD_S3_BUCKET }}"
            ENV="production"
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            BUCKET="${{ secrets.STAGING_S3_BUCKET }}"
            ENV="staging"
          else
            echo "❌ Invalid branch for deployment"
            exit 1
          fi

          echo "🚀 Deploying to $ENV bucket: $BUCKET"

          aws s3 sync dist/ "s3://$BUCKET" --delete

          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "public, max-age=0, must-revalidate"

          echo "✅ Successfully deployed to $ENV"
