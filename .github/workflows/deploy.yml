name: Frontend CI & Deploy

on:
  pull_request:
    branches: [develop, main]

  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:

  # ─────────────────────────────
  # CI (NO DEPLOY, NO SECRETS)
  # ─────────────────────────────
  ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (staging default for validation)
        env:
          VITE_API_URL: ${{ secrets.STAGING_API_URL }}
        run: npm run build


  # ─────────────────────────────
  # DEPLOY JOB
  # ─────────────────────────────
  deploy:
    name: Deploy to S3
    if: github.event_name == 'push'
    needs: [ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Decide environment ─────────────────
      - name: Set environment variables
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "VITE_API_URL=${{ secrets.PROD_API_URL }}" >> $GITHUB_ENV
            echo "BUCKET=${{ secrets.PROD_S3_BUCKET }}" >> $GITHUB_ENV
            echo "ENV=production" >> $GITHUB_ENV
          else
            echo "VITE_API_URL=${{ secrets.STAGING_API_URL }}" >> $GITHUB_ENV
            echo "BUCKET=${{ secrets.STAGING_S3_BUCKET }}" >> $GITHUB_ENV
            echo "ENV=staging" >> $GITHUB_ENV
          fi

      - name: Build app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy to S3
        run: |
          echo "🚀 Deploying $ENV to bucket $BUCKET"

          aws s3 sync dist/ "s3://$BUCKET" --delete

          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "public, max-age=0, must-revalidate"

          echo "✅ Deploy complete for $ENV"
